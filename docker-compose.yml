# Local development Postgres only (app runs on the host via `pnpm run dev`).
# Pre-prod / prod stacks live under deploy/docker-compose.yml — see deploy/README.md.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: isms-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: isms
      POSTGRES_PASSWORD: isms
      POSTGRES_DB: isms
    volumes:
      - isms_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isms -d isms"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  isms_pg_data:
