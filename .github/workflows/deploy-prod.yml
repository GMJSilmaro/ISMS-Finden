name: Deploy prod

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    name: Build & deploy prod
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image metadata
        id: meta
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_LC=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${{ env.REGISTRY }}/${OWNER_LC}/${REPO_LC}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:prod
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            REPO_DIR="${{ vars.DEPLOY_REPO_DIR || '/opt/isms/repo' }}"
            ENV_FILE="${{ vars.PROD_ENV_FILE || '/opt/isms/prod/.env' }}"
            IMAGE="${{ steps.meta.outputs.image }}:prod"

            if [ ! -f "$ENV_FILE" ]; then
              echo "Missing $ENV_FILE — copy deploy/.env.prod.example and fill secrets first."
              exit 1
            fi

            cd "$REPO_DIR"
            git fetch --all --prune
            git checkout main
            git pull --ff-only origin main

            if grep -q '^IMAGE=' "$ENV_FILE"; then
              sed -i "s|^IMAGE=.*|IMAGE=${IMAGE}|" "$ENV_FILE"
            else
              echo "IMAGE=${IMAGE}" >> "$ENV_FILE"
            fi

            PULL_TOKEN='${{ secrets.GHCR_TOKEN }}'
            if [ -n "$PULL_TOKEN" ]; then
              echo "$PULL_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            else
              echo "Warning: GHCR_TOKEN not set — pull only works if the package is public"
            fi

            docker compose -p isms-prod --env-file "$ENV_FILE" \
              -f deploy/docker-compose.yml pull
            docker compose -p isms-prod --env-file "$ENV_FILE" \
              -f deploy/docker-compose.yml up -d --remove-orphans

            docker compose -p isms-prod --env-file "$ENV_FILE" \
              -f deploy/docker-compose.yml ps
