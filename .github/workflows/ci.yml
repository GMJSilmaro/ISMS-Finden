name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          DATABASE_URL: postgresql://isms:isms@127.0.0.1:5432/isms
          DIRECT_URL: postgresql://isms:isms@127.0.0.1:5432/isms

      - name: Generate Prisma client
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: postgresql://isms:isms@127.0.0.1:5432/isms
          DIRECT_URL: postgresql://isms:isms@127.0.0.1:5432/isms

      - name: ESLint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck
